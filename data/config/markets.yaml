# Discovery + venue configuration.

polymarket:
  gamma_base: https://gamma-api.polymarket.com
  clob_base: https://clob.polymarket.com
  # Keyset pagination: /events/keyset?after_cursor=...  (offset is rejected by the API)
  page_limit: 100
  books_batch_size: 50

  discovery:
    # An event is kept only if its title contains a TICKER in parentheses AND one of these
    # patterns. Patterns are matched case-insensitively against the title.
    title_patterns:
      - "close above"
      - "closes above"
      - "finish week"
      - "closes week"
      - " hit "
      - "up or down"
    # Parenthesised tokens that look like tickers but are not.
    ticker_blocklist:
      [BO3, BO5, BO7, GOP, DEM, DNC, RNC, UK, US, EU, UN, USA, CEO, GDP, CPI, FED, ATH,
       AI, NBA, NFL, MLB, NHL, UFC, F1, WWE, LOL, CS2, PGA, ATP, WTA, MVP, OT, TBD, ETF,
       IPO, FBI, CIA, WHO, NATO, OPEC, SEC, IRS, DOJ, ICE, NASA, SPAC, LLC, INC]
    # Events carrying any of these tag slugs are discarded outright.
    tag_blocklist:
      [sports, esports, games, politics, elections, pop-culture, mentions, crypto-prices]
    # Tickers we deliberately do not track (no US-listed options).
    ticker_exclude: [SKHY]
    # Only keep events whose ticker appears here or in underlyings.yaml. Empty = allow any
    # ticker that passes the pattern + blocklist filters (default, so new months just work).
    ticker_allowlist: []

# Raw archiving. Per-cycle raw was 54 GB/yr and no model ever reads it; every
# field we parse is already in Parquet. Market rules/metadata ARE archived, but
# only once per market and again only if the venue changes the text.
raw:
  archive_books: false
  archive_option_chains: false
  archive_market_rules: true

kalshi:
  base: https://api.elections.kalshi.com/trade-api/v2
  orderbook_depth: 100
  # Kalshi is the secondary track and is the slowest part of a snapshot (~140s
  # for ~3.5k single-book requests). 15 = every tick; 60 = hourly.
  interval_minutes: 60
  # Kalshi exposes one book per request; fetch them concurrently.
  book_workers: 8
  # Which underlying each series is written on, so its strikes can drive the
  # option strike filter for SPX / NDX (neither has a Polymarket market).
  series_underlying:
    KXINXU: SPX
    KXINX: SPX
    KXINXDUD: SPX
    KXINXY: SPX
    KXINXDIRY: SPX
    KXINXPOS: SPX
    KXINXMAXY: SPX
    KXINXMINY: SPX
    KXSP500WHEN: SPX
    KXNASDAQ100U: NDX
    KXNASDAQ100: NDX
    KXNASDAQDUD: NDX
    KXNASDAQ100Y: NDX
    KXNDQDIRY: NDX
    KXNASDAQ100POS: NDX
    KXNASDAQ100MAXY: NDX
    KXNASDAQ100MINY: NDX

  series:
    index_digitals: [KXINXU, KXINX, KXINXDUD, KXNASDAQ100U, KXNASDAQ100, KXNASDAQDUD]
    year_end: [KXINXY, KXINXDIRY, KXNASDAQ100Y, KXNDQDIRY, KXINXPOS, KXNASDAQ100POS]
    barriers: [KXINXMAXY, KXINXMINY, KXNASDAQ100MAXY, KXNASDAQ100MINY, KXSP500WHEN]

cboe:
  base: https://cdn.cboe.com/api/global/delayed_quotes/options
  enabled: true

rates:
  treasury_bill_csv: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{year}/all?type=daily_treasury_bill_rates&field_tdr_date_value={year}&page&_format=csv"
  treasury_par_csv: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{year}/all?type=daily_treasury_yield_curve&field_tdr_date_value={year}&page&_format=csv"
  fred_series: [DGS1MO, DGS3MO, DGS6MO, DGS1]
  fred_csv: "https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}"

http:
  timeout_seconds: 30
  max_retries: 5
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0
  user_agent: "poly-options-research/0.1 (read-only market data collection)"
  # Randomised pause between yfinance calls, seconds.
  yf_pause_min: 0.4
  yf_pause_max: 1.3

schedule:
  market_tz: America/New_York
  regular_open: "09:30"
  regular_close: "16:00"
  intraday_interval_minutes: 15
  offhours_interval_minutes: 60
