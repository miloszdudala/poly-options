# Discovery + venue configuration.

polymarket:
  gamma_base: https://gamma-api.polymarket.com
  clob_base: https://clob.polymarket.com
  # Keyset pagination: /events/keyset?after_cursor=...  (offset is rejected by the API)
  page_limit: 100
  books_batch_size: 50

  discovery:
    # An event is kept only if its title contains a TICKER in parentheses AND one of these
    # patterns. Patterns are matched case-insensitively against the title.
    title_patterns:
      - "close above"
      - "closes above"
      - "finish week"
      - "closes week"
      - " hit "
      - "up or down"
    # Parenthesised tokens that look like tickers but are not.
    ticker_blocklist:
      [BO3, BO5, BO7, GOP, DEM, DNC, RNC, UK, US, EU, UN, USA, CEO, GDP, CPI, FED, ATH,
       AI, NBA, NFL, MLB, NHL, UFC, F1, WWE, LOL, CS2, PGA, ATP, WTA, MVP, OT, TBD, ETF,
       IPO, FBI, CIA, WHO, NATO, OPEC, SEC, IRS, DOJ, ICE, NASA, SPAC, LLC, INC]
    # Events carrying any of these tag slugs are discarded outright.
    tag_blocklist:
      [sports, esports, games, politics, elections, pop-culture, mentions, crypto-prices]
    # Tickers we deliberately do not track (no US-listed options).
    ticker_exclude: [SKHY]
    # Only keep events whose ticker appears here or in underlyings.yaml. Empty = allow any
    # ticker that passes the pattern + blocklist filters (default, so new months just work).
    ticker_allowlist: []

# Raw archiving. Per-cycle raw was 54 GB/yr and no model ever reads it; every
# field we parse is already in Parquet. Market rules/metadata ARE archived, but
# only once per market and again only if the venue changes the text.
raw:
  archive_books: false
  archive_option_chains: false
  archive_market_rules: true

kalshi:
  base: https://api.elections.kalshi.com/trade-api/v2
  orderbook_depth: 100
  # 15 = every tick; 60 = hourly. Hourly on purpose: the Kalshi series we track
  # are index digitals with distant (largely year-end) expiries, so they simply
  # do not move fast enough to be worth a 15-minute sample. book_filter brought
  # the cost down to 2,201 requests / ~88 s, so 15 is affordable if the tracked
  # series ever shift to near-dated contracts - it is a cadence choice now, not
  # a budget one. Hourly books are ~2.6 GB/yr, every-tick ~6.5 GB/yr.
  interval_minutes: 60
  # Kalshi exposes one book per request; fetch them concurrently. MEASURED
  # 2026-09-16: throughput is flat at ~25 req/s at 8, 16 and 24 workers (24.2,
  # 23.9, 27.1 req/s over two passes each) - the cap is server side, not ours,
  # so more threads buy nothing and just lean harder on a public API. The only
  # lever that moves the clock is sending fewer requests: see book_filter.
  # The HTTP connection pool is sized from this number, so it stays safe to
  # raise if Kalshi ever lifts the cap.
  book_workers: 8

  # Deep books are only worth a request where something could actually trade.
  # Measured 2026-09-16: of 3,519 open markets, 268 had ever traded and ~1,000
  # were quoted more than 20c wide with zero open interest - those are ladder
  # fillers, not markets. Top of book for EVERY market is still stored, because
  # GET /markets already returns yes_bid/yes_ask and their sizes in ~10 paged
  # requests; this filter only decides who additionally gets a depth request.
  book_filter:
    enabled: true
    max_spread: 0.20       # quoted wider than this and never traded -> skip
    # Series that always get full depth regardless of the filter, because they
    # are the tight ones we actually care about pricing.
    always_series: [KXINXY, KXINXDIRY, KXNASDAQ100Y, KXNDQDIRY, KXINXPOS,
                    KXNASDAQ100POS, KXINXMAXY, KXINXMINY, KXNASDAQ100MAXY,
                    KXNASDAQ100MINY, KXSP500WHEN]
  # Which underlying each series is written on, so its strikes can drive the
  # option strike filter for SPX / NDX (neither has a Polymarket market).
  series_underlying:
    KXINXU: SPX
    KXINX: SPX
    KXINXDUD: SPX
    KXINXY: SPX
    KXINXDIRY: SPX
    KXINXPOS: SPX
    KXINXMAXY: SPX
    KXINXMINY: SPX
    KXSP500WHEN: SPX
    KXNASDAQ100U: NDX
    KXNASDAQ100: NDX
    KXNASDAQDUD: NDX
    KXNASDAQ100Y: NDX
    KXNDQDIRY: NDX
    KXNASDAQ100POS: NDX
    KXNASDAQ100MAXY: NDX
    KXNASDAQ100MINY: NDX

  series:
    index_digitals: [KXINXU, KXINX, KXINXDUD, KXNASDAQ100U, KXNASDAQ100, KXNASDAQDUD]
    year_end: [KXINXY, KXINXDIRY, KXNASDAQ100Y, KXNDQDIRY, KXINXPOS, KXNASDAQ100POS]
    barriers: [KXINXMAXY, KXINXMINY, KXNASDAQ100MAXY, KXNASDAQ100MINY, KXSP500WHEN]

cboe:
  base: https://cdn.cboe.com/api/global/delayed_quotes/options
  enabled: true

rates:
  treasury_bill_csv: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{year}/all?type=daily_treasury_bill_rates&field_tdr_date_value={year}&page&_format=csv"
  treasury_par_csv: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{year}/all?type=daily_treasury_yield_curve&field_tdr_date_value={year}&page&_format=csv"
  fred_series: [DGS1MO, DGS3MO, DGS6MO, DGS1]
  fred_csv: "https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}"

http:
  timeout_seconds: 30
  max_retries: 5
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0
  user_agent: "poly-options-research/0.1 (read-only market data collection)"
  # Randomised pause between yfinance calls, seconds.
  yf_pause_min: 0.4
  yf_pause_max: 1.3

schedule:
  market_tz: America/New_York
  regular_open: "09:30"
  regular_close: "16:00"
  intraday_interval_minutes: 15
  # Collect ONLY while the NYSE regular session is open. Prediction markets do
  # keep trading overnight and at weekends, but the whole point of the dataset
  # is aligning a book against an option chain, and the options are not quoted
  # then - an off-hours book row has nothing to be compared with. Set true to
  # resume hourly off-hours snapshots (they cost ~2 GB/yr and were the reason
  # the machine had to stay awake around the clock).
  collect_offhours: false
  offhours_interval_minutes: 60
  # Hard stop for one snapshot, seconds. A brief connectivity drop once turned a
  # ~150 s run into 1,569 s: the retry ladder (5 attempts backing off to 60 s)
  # ran per-token across a failed 50-token batch. The cycle itself was fine, but
  # it delayed the NEXT snapshot by 41 minutes - the outage cost two cycles
  # rather than part of one. Past this, remaining work is abandoned and whatever
  # was collected is written. 0 disables. The daily job is never deadlined; it
  # legitimately takes ~17 minutes.
  snapshot_deadline_seconds: 600
