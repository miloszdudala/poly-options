# Extension: Polymarket weekly range markets on stocks, priced from the call
# spread at the expiry that closes exactly at the deadline (none: skipped).
extends: mvp
markets: {use: polymarket_chain, contract_type: range, period: weekly,
          exclude_tickers: [WTI, XAUUSD, XAGUSD, DXY, GLD, SLV, USO, UUP]}
inputs: {use: chain}
vol: {use: none}
prob: {use: call_spread, stale_chain_s: 1800}
gates: {use: standard, drop: [no_fair]}
