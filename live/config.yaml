# Live trading settings. Nothing in model/ reads this file, and nothing here
# changes a replay: the two sections are tuned separately on purpose.
#
# EVERY VALUE BELOW IS A PLACEHOLDER Claude chose on 2026-10-17 so the code
# would run. The user has not chosen them; see "Not decided yet" in README.md.

# The master switch. `trader.py run --live` refuses to send an order unless this
# is true. Leave it false until the geoblock check passes where you are.
armed: false

# -- money ----------------------------------------------------------------
# The most the book may have at risk at once: open cost (what was paid for
# positions not yet settled) plus anything about to be bought. Counted from
# this program's own ledger, never from the wallet balance, so topping up the
# wallet does not raise it.
bankroll_usd: 50.0
# Per market, both sides alike. Polymarket's minimum order on these markets is
# 5 shares, so $5 buys a minimum order at any price under 99c.
cap_per_market_usd: 5.0
# Spending stops for the US session once this much has been bought in it.
daily_spend_usd: 20.0
# At most this many orders per one-minute cycle, best ROI first.
max_orders_per_cycle: 1

# -- the bar a bet has to clear (same meaning as sim.candidate_edges) -----
# The $100 test of 2026-10-15 found a higher EV bar helped; it has not yet
# been re-tested with both sides, which is the thing to do before arming.
min_ev: 0.06
min_roi: 0.08
# Above this price the ROI bar replaces the EV bar (MODELS 2).
high_price: 0.90
high_price_min_roi: 0.02
high_price_min_ev: 0.0
# Charged to every YES on top of the bar: the volatility risk premium.
yes_premium: 0.02

# -- execution -------------------------------------------------------------
# Never take more than this share of any one price level.
take_fraction: 0.5
# Fee used to DECIDE. "conservative" is the models' 0.04 x min(p, 1-p), so a
# live bet clears exactly the bar a replayed one did. The venue actually
# charges 0.04 x p x (1-p) (measured 2026-10-17, /clob-markets fd={r:0.04,e:1}),
# which is lower; "venue" decides on that instead. The ledger records what
# the venue charged either way.
fee_model: conservative
fee_rate: 0.04

# -- the loop (`trader.py loop`) ---------------------------------------------
# One decision per this many seconds.
loop_seconds: 60
# Fair values come from the collector's 15-minute snapshot and are moved along
# their delta to the current spot every cycle. Past this age the snapshot is
# not traded on at all.
max_cycle_age_minutes: 20
# A ticker that has moved more than this (fraction of spot) since the snapshot
# is skipped until the next one: a first-order delta is not good that far.
max_spot_move: 0.01
# When no snapshot is newer than this, the loop runs the collector's snapshot
# job itself, so live trading does not need the launchd jobs installed.
collect_if_older_than_minutes: 16
